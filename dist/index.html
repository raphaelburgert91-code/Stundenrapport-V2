<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2f6f5e">
    <meta name="description" content="Einfache Arbeitszeiterfassung">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <title>Arbeitsstunden</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="app-header">
      <div class="title-block">
        <p class="eyebrow" id="appSubtitle">Arbeitszeiterfassung</p>
        <h1 id="appTitle">Arbeitsstunden</h1>
        <p id="saveStatus" class="save-status" hidden>Gespeichert</p>
      </div>
      <div class="header-tools">
        <label class="header-field header-name-field" for="nameInput">
          <span>Name</span>
          <input id="nameInput" type="text" inputmode="text" autocomplete="name" placeholder="Name eingeben" aria-label="Name">
        </label>
        <label class="header-field" for="dateInput">
          <span>Datum</span>
          <input id="dateInput" type="date" aria-label="Datum auswählen">
        </label>
        <label class="header-field" for="weekSelect">
          <span>Jahr / KW</span>
          <select id="weekSelect" aria-label="Kalenderwoche auswählen"></select>
        </label>
      </div>
    </header>

    <main>
      <div class="primary-toolbar">
        <nav class="tabbar" aria-label="Ansichten">
          <button class="tab active" data-view="entryView" type="button">Wochenübersicht</button>
          <button class="tab" data-view="monthlyView" type="button">Monatsübersicht</button>
          <button class="tab" data-view="yearlyView" type="button">Jahresübersicht</button>
          <button class="tab" data-view="settingsView" type="button">Einstellungen</button>
          <button class="tab" data-view="reportView" type="button">Rapport</button>
        </nav>

        <section class="dashboard" aria-label="Übersicht">
          <article class="metric carry-metric">
            <label class="metric-label" for="weekCarryInput">Übertrag</label>
            <input id="weekCarryInput" class="carry-input" type="text" inputmode="numeric" autocomplete="off" aria-label="Übertrag zu Beginn der Woche">
            <small id="weekCarryHint" class="carry-hint" hidden>Übertrag manuell angepasst</small>
          </article>
        </section>
      </div>

      <section id="entryView" class="view active" aria-label="Wochen-Eingabe">
        <div id="dayCards" class="day-grid"></div>
      </section>

      <section id="monthlyView" class="view" aria-label="Monatsübersicht">
        <div class="view-toolbar">
          <div class="field-grid">
            <label>
              <span>Monat</span>
              <select id="monthSelect" aria-label="Monat auswählen">
                <option value="1">Januar</option>
                <option value="2">Februar</option>
                <option value="3">März</option>
                <option value="4">April</option>
                <option value="5">Mai</option>
                <option value="6">Juni</option>
                <option value="7">Juli</option>
                <option value="8">August</option>
                <option value="9">September</option>
                <option value="10">Oktober</option>
                <option value="11">November</option>
                <option value="12">Dezember</option>
              </select>
            </label>
            <label>
              <span>Jahr</span>
              <select id="yearSelect" aria-label="Jahr auswählen"></select>
            </label>
          </div>
          <button id="openWeekFromMonthButton" class="primary" type="button">Zur Wochenansicht</button>
        </div>
        <div id="monthSummary" class="summary-grid"></div>
        <div class="table-card">
          <table class="data-table">
            <thead>
              <tr>
                <th>Woche</th>
                <th>Zeitraum</th>
                <th>Ist</th>
                <th>Soll</th>
                <th>Plus / Minus</th>
                <th>Übertrag</th>
              </tr>
            </thead>
            <tbody id="monthlyTableBody"></tbody>
          </table>
        </div>
      </section>

      <section id="yearlyView" class="view" aria-label="Jahresübersicht">
        <div class="view-toolbar">
          <label>
            <span>Jahr</span>
            <select id="yearlySelect" aria-label="Jahr auswählen"></select>
          </label>
        </div>
        <div id="yearlySummary" class="summary-grid"></div>
        <div class="table-card">
          <table class="data-table">
            <thead>
              <tr>
                <th>Monat</th>
                <th>Ist-Stunden</th>
                <th>Sollstunden</th>
                <th>Plus / Minus</th>
              </tr>
            </thead>
            <tbody id="yearlyTableBody"></tbody>
          </table>
        </div>
      </section>

      <section id="settingsView" class="view" aria-label="Einstellungen">
        <div class="settings-card">
          <label class="settings-field">
            <span>Name</span>
            <input id="settingsNameInput" type="text" inputmode="text" autocomplete="name" placeholder="Name eingeben">
          </label>
          <label class="settings-field">
            <span>Sollstunden pro Woche</span>
            <input id="weeklyTargetInput" type="text" inputmode="decimal" autocomplete="off" placeholder="20,44">
          </label>
          <label class="settings-field">
            <span>Bundesland / Region</span>
            <select id="settingsRegionInput" aria-label="Bundesland oder Region auswählen">
              <option value="Baden-Württemberg">Baden-Württemberg</option>
              <option value="Bayern">Bayern</option>
              <option value="Berlin">Berlin</option>
              <option value="Brandenburg">Brandenburg</option>
              <option value="Bremen">Bremen</option>
              <option value="Hamburg">Hamburg</option>
              <option value="Hessen">Hessen</option>
              <option value="Mecklenburg-Vorpommern">Mecklenburg-Vorpommern</option>
              <option value="Niedersachsen">Niedersachsen</option>
              <option value="Nordrhein-Westfalen">Nordrhein-Westfalen</option>
              <option value="Rheinland-Pfalz">Rheinland-Pfalz</option>
              <option value="Saarland">Saarland</option>
              <option value="Sachsen">Sachsen</option>
              <option value="Sachsen-Anhalt">Sachsen-Anhalt</option>
              <option value="Schleswig-Holstein">Schleswig-Holstein</option>
              <option value="Thüringen">Thüringen</option>
            </select>
          </label>
          <label class="settings-field">
            <span>Jahr</span>
            <input id="settingsYearInput" type="number" inputmode="numeric" min="2026" step="1" placeholder="2026">
          </label>
          <div class="settings-actions">
            <button id="backupSaveButton" type="button">Backup speichern</button>
            <label class="import-button" for="backupLoadInput">Backup laden</label>
            <input id="backupLoadInput" class="file-input" type="file" accept="application/json,.json">
          </div>
          <p class="helper-text">Alle Einstellungen werden lokal gespeichert und bleiben auf diesem Gerät erhalten.</p>
        </div>
      </section>

      <section id="reportView" class="view" aria-label="Rapport">
        <div class="actions no-print">
          <label class="report-type-field">
            <span>Rapport</span>
            <select id="reportTypeSelect" aria-label="Rapport auswählen">
              <option value="week">Woche</option>
              <option value="month">Monat</option>
              <option value="year">Jahr</option>
            </select>
          </label>
          <button id="printButton" class="primary" type="button">Drucken / PDF</button>
        </div>
        <p id="reportNotice" class="report-notice" role="status" aria-live="polite" hidden></p>
        <article id="report" class="report"></article>
      </section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
